<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141416" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SuperApp</title>
    <script>
      // Apply the stored theme choice before first paint (no flash). With no
      // stored choice, the CSS prefers-color-scheme media query decides.
      (function () {
        try {
          var t = localStorage.getItem("superapp-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/syne-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
